name: TVRemoteController
options:
  bundleIdPrefix: dev.tvrc
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    # uniffi（Rust）与 Zig C 头的 clang modulemap 搜索路径
    SWIFT_INCLUDE_PATHS: "$(PROJECT_DIR)/VendorModules $(PROJECT_DIR)/VendorModules/Rust $(PROJECT_DIR)/../core-rs/bindings/swift"
    LIBRARY_SEARCH_PATHS:
      - "$(PROJECT_DIR)/VendorLib"
      - "$(PROJECT_DIR)/../core-rs/target/aarch64-apple-ios-sim/release"
    OTHER_LDFLAGS:
      - "-ltvremote_core"
      - "-ltv_remote_core"
      - "-lmbedtls"
      - "-lmbedx509"
      - "-lmbedcrypto"
    # CI 不签名构建；本地开发者需自行配置团队/证书
    CODE_SIGNING_ALLOWED: "NO"
    GENERATE_INFOPLIST_FILE: "YES"
targets:
  TVRemoteApp:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes:
          # App Clip 专属入口不进主 App（共享文件在 Sources 下，两 target 都编译）
          - "AppClipEntry.swift"
    dependencies:
      - target: TVRemoteClip
        embed: true
        codeSign: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.tvrc.ios.app
        TARGETED_DEVICE_FAMILY: "1"
  TVRemoteClip:
    type: app-extension.app-clips
    platform: iOS
    sources:
      - path: AppClip
      - path: Sources
        excludes:
          - "ControllerApp.swift"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.tvrc.ios.clip
        TARGETED_DEVICE_FAMILY: "1"
        # App Clip 唤起域（第 2 期 AASA 确定后填写；构建不依赖该值）
        OTHER_LDFLAGS: "$(inherited)"
schemes:
  TVRemoteApp:
    build:
      targets:
        TVRemoteApp: all
        TVRemoteClip: all
    run:
      config: Debug
  TVRemoteClip:
    build:
      targets:
        TVRemoteClip: all
    run:
      config: Debug
