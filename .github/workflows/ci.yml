name: quality-gates

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Android tests, lint, and builds
        working-directory: android-agent
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/gradle-user-home
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleRelease
      - name: Controller module tests, lint, and build
        working-directory: android-agent
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/gradle-user-home
        run: ./gradlew --no-daemon :controller:testDebugUnitTest :controller:lintDebug :controller:assembleDebug

  miniprogram-core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Typecheck
        working-directory: miniprograms/core
        run: |
          npm install
          npx tsc --noEmit
      - name: Tests (RFC 5869 vectors + protocol consistency)
        working-directory: miniprograms/core
        run: npm test

  rust-core:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - name: Rust core tests
        working-directory: core-rs
        run: cargo test --locked
      - name: Rust core clippy
        working-directory: core-rs
        run: cargo clippy --locked -- -D warnings

  windows-zig:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install locked Zig 0.16.0
        env:
          ZIG_URL: https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz
          ZIG_SHA256: 70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00
        run: |
          curl --fail --location --silent --show-error "$ZIG_URL" --output "${RUNNER_TEMP}/zig.tar.xz"
          echo "${ZIG_SHA256}  ${RUNNER_TEMP}/zig.tar.xz" | sha256sum --check --strict
          mkdir -p "${RUNNER_TEMP}/zig"
          tar -xJf "${RUNNER_TEMP}/zig.tar.xz" --strip-components=1 -C "${RUNNER_TEMP}/zig"
          echo "${RUNNER_TEMP}/zig" >> "$GITHUB_PATH"
      - name: Fetch locked source dependencies
        run: ./scripts/fetch-locked-dependencies.sh
      - name: Validate locked release inputs
        run: python3 scripts/release-preflight.py
      - name: Zig tests
        working-directory: windows-controller
        env:
          ZIG_GLOBAL_CACHE_DIR: ${{ runner.temp }}/zig-global-cache
          ZIG_LOCAL_CACHE_DIR: ${{ runner.temp }}/zig-local-cache-test
        run: zig build test
      - name: Windows ReleaseSafe cross-builds
        working-directory: windows-controller
        env:
          ZIG_GLOBAL_CACHE_DIR: ${{ runner.temp }}/zig-global-cache
        run: |
          for target in x86-windows-gnu x86_64-windows-gnu aarch64-windows-gnu; do
            export ZIG_LOCAL_CACHE_DIR="${RUNNER_TEMP}/zig-local-cache-${target}"
            zig build -Doptimize=ReleaseSafe -Dtarget="$target" --prefix "${RUNNER_TEMP}/build-${target}"
          done

  macos:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"
      - name: Install locked Zig 0.16.0
        run: |
          case "$(uname -m)" in
            arm64)
              zig_url=https://ziglang.org/download/0.16.0/zig-aarch64-macos-0.16.0.tar.xz
              zig_sha=b23d70deaa879b5c2d486ed3316f7eaa53e84acf6fc9cc747de152450d401489
              ;;
            x86_64)
              zig_url=https://ziglang.org/download/0.16.0/zig-x86_64-macos-0.16.0.tar.xz
              zig_sha=0387557ed1877bc6a2e1802c8391953baddba76081876301c522f52977b52ba7
              ;;
            *) exit 1 ;;
          esac
          curl --fail --location --silent --show-error "$zig_url" --output "${RUNNER_TEMP}/zig.tar.xz"
          echo "${zig_sha}  ${RUNNER_TEMP}/zig.tar.xz" | shasum -a 256 --check
          mkdir -p "${RUNNER_TEMP}/zig"
          tar -xJf "${RUNNER_TEMP}/zig.tar.xz" --strip-components=1 -C "${RUNNER_TEMP}/zig"
          echo "${RUNNER_TEMP}/zig" >> "$GITHUB_PATH"
      - name: Fetch locked source dependencies
        run: ./scripts/fetch-locked-dependencies.sh
      - name: Swift core logic tests
        env:
          CLANG_MODULE_CACHE_PATH: ${{ runner.temp }}/clang-module-cache
          SWIFTPM_MODULECACHE_OVERRIDE: ${{ runner.temp }}/swiftpm-module-cache
        run: swift test --package-path macos-controller --scratch-path "${RUNNER_TEMP}/swift-build"
      - name: Rust iOS static libraries (aarch64-ios + sim)
        run: |
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim
          cargo build --locked --release --target aarch64-apple-ios --manifest-path core-rs/Cargo.toml
          cargo build --locked --release --target aarch64-apple-ios-sim --manifest-path core-rs/Cargo.toml
      - name: Package tvremote_core XCFramework
        run: |
          mkdir -p "${RUNNER_TEMP}/xcframework-headers"
          cp core-rs/bindings/swift/tvremote_coreFFI.modulemap "${RUNNER_TEMP}/xcframework-headers/module.modulemap"
          cp core-rs/bindings/swift/tvremote_coreFFI.h "${RUNNER_TEMP}/xcframework-headers/"
          xcodebuild -create-xcframework \
            -library core-rs/target/aarch64-apple-ios/release/libtvremote_core.a -headers "${RUNNER_TEMP}/xcframework-headers" \
            -library core-rs/target/aarch64-apple-ios-sim/release/libtvremote_core.a -headers "${RUNNER_TEMP}/xcframework-headers" \
            -output "${RUNNER_TEMP}/tvremote_core.xcframework"
          mkdir -p "${RUNNER_TEMP}/tvrc-ios-bindings"
          cp core-rs/bindings/swift/tvremote_core.swift "${RUNNER_TEMP}/tvrc-ios-bindings/"
          echo "XCFramework at ${RUNNER_TEMP}/tvremote_core.xcframework"
      - name: iOS compile gate (TVRemoteCoreLogic typecheck on simulator SDK)
        run: |
          swiftc -swift-version 6 -typecheck \
            -target arm64-apple-ios16.0-simulator \
            -sdk "$(xcrun -sdk iphonesimulator --show-sdk-path)" \
            macos-controller/Sources/TVRemoteCoreLogic/CoreLogic.swift
          swiftc -swift-version 6 -typecheck \
            -target arm64-apple-ios16.0 \
            -sdk "$(xcrun -sdk iphoneos --show-sdk-path)" \
            macos-controller/Sources/TVRemoteCoreLogic/CoreLogic.swift
      - name: Prepare iOS SwiftPM vendored sources (typecheck/link/xctest prerequisites)
        run: |
          mkdir -p ios-controller/Sources/RustBindings ios-controller/Sources/ZigCore ios-controller/VendorModules/Rust
          cp core-rs/bindings/swift/tvremote_core.swift ios-controller/Sources/RustBindings/
          cp macos-controller/Sources/TVRemoteCoreLogic/CoreLogic.swift ios-controller/Sources/ZigCore/
          cp core-rs/bindings/swift/tvremote_coreFFI.h ios-controller/VendorModules/Rust/
          cp core-rs/bindings/swift/tvremote_coreFFI.modulemap ios-controller/VendorModules/Rust/module.modulemap
      - name: Generate Xcode project (xcodegen) and build App + App Clip targets
        run: |
          set -o pipefail
          brew install xcodegen
          # App Clip/主 App 构建需要 Zig sim 静态库——先执行交叉构建（复用 XCTest 步骤产物路径）
          cd windows-controller
          export TVRC_IOS_SDK_PATH="$(xcrun -sdk iphonesimulator --show-sdk-path)"
          zig build -Doptimize=ReleaseSafe -Dtarget=aarch64-ios-simulator --prefix "${RUNNER_TEMP}/zig-ios-sim-core"
          cd ..
          mkdir -p ios-controller/VendorLib
          cp "${RUNNER_TEMP}/zig-ios-sim-core/lib/"lib*.a ios-controller/VendorLib/
          cd ios-controller
          xcodegen generate
          # xcodegen 2.46 生成 objectVersion 77（Xcode 16 项目格式）——runner 的 Xcode 15.4 打不开，
          # 切到可用的 Xcode 16+（macos-14 image 预装多个版本）
          XCODE16="$(ls -d /Applications/Xcode_1[6-9]*.app 2>/dev/null | sort -V | tail -1)"
          if [ -n "$XCODE16" ]; then
            echo "Using $XCODE16"
            export DEVELOPER_DIR="$XCODE16/Contents/Developer"
          fi
          xcodebuild -version
          xcodebuild build \
            -project TVRemoteController.xcodeproj \
            -scheme TVRemoteApp \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "${RUNNER_TEMP}/ios-appclip-derived" \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee "${RUNNER_TEMP}/appclip-build.log" | tail -5 || true
          grep -E "error:" "${RUNNER_TEMP}/appclip-build.log" | grep -vE "warning" | head -30 || true
          if grep -q "BUILD FAILED" "${RUNNER_TEMP}/appclip-build.log"; then
            echo "App Clip / App build failed"
            exit 1
          fi
      - name: iOS controller typecheck (SwiftUI shell + Rust FFI + Zig core header)
        run: |
          swiftc -swift-version 6 -typecheck \
            -target arm64-apple-ios16.0-simulator \
            -sdk "$(xcrun -sdk iphonesimulator --show-sdk-path)" \
            -Xcc -fmodule-map-file=ios-controller/VendorModules/module.modulemap \
            -Xcc -fmodule-map-file=core-rs/bindings/swift/tvremote_coreFFI.modulemap \
            -I core-rs/bindings/swift \
            ios-controller/Sources/*.swift \
            ios-controller/Sources/RustBindings/tvremote_core.swift \
            ios-controller/Sources/ZigCore/CoreLogic.swift
      - name: Zig core cross-build for iOS device
        working-directory: windows-controller
        env:
          ZIG_GLOBAL_CACHE_DIR: ${{ runner.temp }}/zig-global-cache-ios
          ZIG_LOCAL_CACHE_DIR: ${{ runner.temp }}/zig-local-cache-ios
          TVRC_IOS_SDK_PATH: /Library/Developer/CommandLineTools/SDKs/MacOSX.sdk
        run: |
          export TVRC_IOS_SDK_PATH="$(xcrun -sdk iphoneos --show-sdk-path)"
          echo "iOS SDK: $TVRC_IOS_SDK_PATH"
          zig build -Doptimize=ReleaseSafe -Dtarget=aarch64-ios --prefix "${RUNNER_TEMP}/zig-ios-core"
          export TVRC_IOS_SDK_PATH="$(xcrun -sdk iphonesimulator --show-sdk-path)"
          zig build -Doptimize=ReleaseSafe -Dtarget=aarch64-ios-simulator --prefix "${RUNNER_TEMP}/zig-ios-sim-core"
      - name: iOS full link gate (SwiftUI + Zig core + Rust core)
        run: |
          # Xcode 16+ 的 compiler-rt 在 toolchain 而非 SDK，库名拆分为 *_runtime 变体
          CLANG_RT_A="$(find "$(xcrun -f clang | sed 's|/bin/clang||')/../lib" -name "libclang_rt.ios*.a" 2>/dev/null | head -1)"
          [ -z "$CLANG_RT_A" ] && CLANG_RT_A="$(find /Applications/Xcode.app/Contents/Developer/Toolchains -name "libclang_rt.ios*.a" 2>/dev/null | head -1)"
          if [ -z "$CLANG_RT_A" ]; then echo "libclang_rt.ios*.a not found"; exit 1; fi
          echo "clang_rt: $CLANG_RT_A"
          CLANG_RT_LIB="$(basename "$CLANG_RT_A" | sed 's/^lib//;s/\.a$//')"
          swiftc -swift-version 6 -parse-as-library \
            -target arm64-apple-ios16.0 \
            -sdk "$(xcrun -sdk iphoneos --show-sdk-path)" \
            -Xcc -fmodule-map-file=ios-controller/VendorModules/module.modulemap \
            -Xcc -fmodule-map-file=core-rs/bindings/swift/tvremote_coreFFI.modulemap \
            -I core-rs/bindings/swift \
            ios-controller/Sources/*.swift \
            ios-controller/Sources/RustBindings/tvremote_core.swift \
            ios-controller/Sources/ZigCore/CoreLogic.swift \
            -L "${RUNNER_TEMP}/zig-ios-core/lib" -ltv_remote_core -lmbedtls -lmbedx509 -lmbedcrypto \
            -L core-rs/target/aarch64-apple-ios/release -ltvremote_core \
            -L "$(dirname "$CLANG_RT_A")" "-l${CLANG_RT_LIB}" \
            -framework SwiftUI -framework UIKit \
            -o "${RUNNER_TEMP}/TVRemoteController-ios-sim"
          file "${RUNNER_TEMP}/TVRemoteController-ios-sim"
      - name: iOS XCTest run gate (SwiftPM on iOS Simulator)
        run: |
          set -o pipefail
          # SwiftPM 构建前提：静态库 + 头/modulemap（SwiftPM systemLibrary 要求标准名 module.modulemap）
          mkdir -p ios-controller/VendorLib ios-controller/Sources/RustBindings ios-controller/Sources/ZigCore ios-controller/VendorModules/Rust
          cp core-rs/target/aarch64-apple-ios-sim/release/libtvremote_core.a ios-controller/VendorLib/
          cp "${RUNNER_TEMP}/zig-ios-sim-core/lib/"lib*.a ios-controller/VendorLib/
          cp core-rs/bindings/swift/tvremote_coreFFI.h ios-controller/VendorModules/Rust/
          cp core-rs/bindings/swift/tvremote_coreFFI.modulemap ios-controller/VendorModules/Rust/module.modulemap
          cp core-rs/bindings/swift/tvremote_core.swift ios-controller/Sources/RustBindings/
          cp macos-controller/Sources/TVRemoteCoreLogic/CoreLogic.swift ios-controller/Sources/ZigCore/
          DEVICE="$(xcrun simctl list devices available | grep -m1 'iPhone' | sed -E 's/.*\(([A-F0-9-]+)\).*/\1/')"
          echo "Using simulator UDID: $DEVICE"
          echo "--- available schemes ---"
          xcodebuild -list
          SCHEME="$(xcodebuild -list 2>/dev/null | sed -n '/Schemes:/,$p' | grep -E "IOSControllerTests" | head -1 | xargs || true)"
          # Xcode 15 对 SwiftPM 包只生成「包名」scheme（含全部测试目标）
          if [ -z "$SCHEME" ]; then SCHEME="TVRemoteControllerIOS"; fi
          echo "Using scheme: $SCHEME"
          xcodebuild test \
            -scheme "$SCHEME" \
            -destination "id=$DEVICE" \
            -derivedDataPath "${RUNNER_TEMP}/ios-xcode-derived" \
            2>&1 | tail -60
      - name: ARM64 core and complete app link
        env:
          ZIG_GLOBAL_CACHE_DIR: ${{ runner.temp }}/zig-global-cache
          ZIG_LOCAL_CACHE_DIR: ${{ runner.temp }}/zig-local-cache-macos
          CLANG_MODULE_CACHE_PATH: ${{ runner.temp }}/clang-module-cache
        run: |
          (cd windows-controller && zig build -Doptimize=ReleaseSafe -Dtarget=aarch64-macos.13.0 --prefix "${RUNNER_TEMP}/mac-core")
          swiftc -swift-version 6 -parse-as-library -target arm64-apple-macos13.0 \
            -sdk "$(xcrun --show-sdk-path)" \
            macos-controller/Sources/TVRemoteCoreLogic/CoreLogic.swift \
            macos-controller/Sources/*.swift \
            -L "${RUNNER_TEMP}/mac-core/lib" -ltv_remote_core \
            -Xcc -fmodule-map-file=ios-controller/VendorModules/module.modulemap \
            -framework SwiftUI -framework AppKit -framework Security \
            -framework AVFoundation -framework CoreImage -framework CoreMedia \
            -framework MetalKit -framework VideoToolbox \
            -Xlinker -rpath -Xlinker @executable_path/../Frameworks \
            -o "${RUNNER_TEMP}/tv-remote-control-macos"
